<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>观察者｜薛定谔式人生观测</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <div id="particles"></div>

  <div id="loading-overlay">
    <div class="loader-ring"></div>
  </div>

  <main class="app">
    <section id="screen-start" class="screen active">
      <div class="panel">
        <div class="splash-icon">◉</div>
        <h1 class="title">观察者｜解锁你的薛定谔式人生</h1>
        <p class="sub">不必借算命，聊聊就懂你的轮廓。观察者不定义，只懂你。</p>
        <button id="btn-start" class="btn">开始观测 →</button>
      </div>
    </section>

    <section id="screen-chat" class="screen">
      <div class="panel">
        <h2>先聊三句，快速破冰</h2>
        <p class="tiny">点选选项即可推进，无需输入文字。</p>
        <div id="chat-box" class="chat-box"></div>
        <div id="chat-options" class="choice-grid"></div>
        <button id="btn-chat-done" class="btn hide">聊完了，开始观测 →</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="panel">
        <div class="quiz-head">
          <p class="tiny">观察者正在观测...</p>
          <div class="progress-track">
            <div id="quiz-progress" class="progress-fill"></div>
          </div>
          <p id="quiz-index" class="tiny">1 / 8</p>
        </div>
        <h3 id="quiz-question"></h3>
        <div id="quiz-options" class="choice-grid"></div>
        <button id="btn-quiz-next" class="btn" disabled>下一题</button>
      </div>
    </section>

    <section id="screen-card" class="screen">
      <div class="panel">
        <h2>凭直觉，选一张最有感觉的卡</h2>
        <p class="sub">不用多想，跟着本心走。</p>
        <div id="card-grid" class="card-grid"></div>
        <p id="card-tip" class="sub card-tip"></p>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="panel">
        <h2 id="result-title">你的专属薛定谔式人生观测报告</h2>
        <p id="result-intro" class="sub"></p>
        <div id="result-wrap" class="result-wrap"></div>

        <div class="actions-row">
          <button id="btn-to-poster" class="btn">生成分享海报</button>
          <button id="btn-retest-1" class="btn secondary">重新测试</button>
        </div>
      </div>
    </section>

    <section id="screen-poster" class="screen">
      <div class="panel">
        <h2>分享海报</h2>
        <p class="sub">自动带入你的核心人格标签与真实 QR</p>
        <div class="poster-box"><canvas id="poster-canvas" width="900" height="1500"></canvas></div>
        <div class="actions-row">
          <button id="btn-save-poster" class="btn">保存海报</button>
          <button id="btn-share" class="btn secondary">分享好友</button>
          <button id="btn-home" class="btn secondary">返回首页</button>
        </div>
      </div>
    </section>

    <section id="screen-end" class="screen">
      <div class="panel">
        <h2 class="title title-sm">读懂自己，才能顺势而行</h2>
        <p class="sub">愿你不内耗、不迷茫，活成自己喜欢的样子。</p>
        <button id="btn-retest-2" class="btn">重新观测</button>
      </div>
    </section>
  </main>

  <audio id="bgm" loop preload="none"
    src="https://cdn.pixabay.com/download/audio/2023/04/14/audio_97359e95d8.mp3?filename=gentle-piano-loop-145597.mp3"></audio>
  <p class="footer-note">本测试仅为娱乐，旨在帮你洞察自我</p>
  <script src="assets/js/app.js"></script>
</body>

</html>
